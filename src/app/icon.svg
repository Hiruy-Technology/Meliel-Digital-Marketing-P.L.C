<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Browser tab icon: the Meliel ladder (same proportions as the logo) on a white tile, so it stays visible on dark tab bars. -->
  <defs>
    <linearGradient id="ladder" gradientUnits="userSpaceOnUse" x1="0" y1="220" x2="0" y2="20">
      <stop offset="0" stop-color="#1D3959"/>
      <stop offset="0.55" stop-color="#406B8F"/>
      <stop offset="1" stop-color="#99C3DE"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="40" fill="#FFFFFF"/>
  <g fill="url(#ladder)">
    <rect x="110" y="20" width="20" height="20"/>
    <rect x="95" y="50" width="50" height="20"/>
    <rect x="95" y="80" width="50" height="20"/>
    <rect x="95" y="110" width="50" height="20"/>
    <rect x="95" y="140" width="50" height="20"/>
    <rect x="95" y="170" width="50" height="20"/>
    <rect x="95" y="200" width="50" height="20"/>
  </g>
</svg>
